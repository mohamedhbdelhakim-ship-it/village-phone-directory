<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أضف رقم جديد - دليل القرية</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      min-height: 92vh;
      max-width: 420px;
      margin: auto;
      color: #333;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      background: #ffffff;
      color: #007BFF;
      padding: 8px 15px;
      text-decoration: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      width: fit-content;
      transition: 0.2s;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    h2 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(45deg, #007BFF, #00d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-top: 5px;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      box-sizing: border-box;
      width: 100%;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #444;
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      box-sizing: border-box;
      border: 2px solid #e1e8ed;
      border-radius: 12px;
      font-size: 15px;
      background: #fafbfc;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #007BFF;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.12);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #28a745, #20c997);
      color: white;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 25px;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">⬅ العودة للرئيسية</a>

  <div class="card">
    <h2>➕ إضافة رقم جديد للدليل</h2>

    <label for="name">الاسم الكامل:</label>
    <input type="text" id="name" placeholder="أدخل اسم الشخص">

    <label for="nickname">الكنية / الشهرة (اختياري):</label>
    <input type="text" id="nickname" placeholder="مثال: أبو محمد، الشناوي">

    <label for="job">المهنة أو الصفة:</label>
    <input type="text" id="job" placeholder="مثال: سباك، طبيب، مواطن">

    <label for="phone">رقم الهاتف:</label>
    <input type="text" id="phone" placeholder="أدخل 11 رقم">

    <button type="button" id="saveBtn" onclick="addNewContact()">حفظ الرقم</button>
    <p id="message"></p>
  </div>

<script type="module">
  import { db, collection, addDoc, getDocs } from "./firebase.js";

  function cleanPhoneNumber(rawPhone) {
    if (!rawPhone) return "";
    let cleaned = rawPhone.replace(/\D/g, '');

    if (cleaned.startsWith('20') && cleaned.length === 13) {
      cleaned = '0' + cleaned.substring(2);
    } else if (cleaned.startsWith('002') && cleaned.length === 14) {
      cleaned = '0' + cleaned.substring(3);
    }

    return cleaned;
  }

  window.addNewContact = async function() {
    const name = document.getElementById("name").value.trim();
    const nickname = document.getElementById("nickname").value.trim();
    const job = document.getElementById("job").value.trim();
    let rawPhoneInput = document.getElementById("phone").value;
    const phone = cleanPhoneNumber(rawPhoneInput);

    const msg = document.getElementById("message");
    const saveBtn = document.getElementById("saveBtn");

    if (!name || !job || !phone) {
      msg.style.color = "#e74c3c";
      msg.innerText = "الرجاء ملء جميع الحقول الإجبارية! ⚠️";
      return;
    }

    if (phone.length !== 11) {
      msg.style.color = "#e74c3c";
      msg.innerText = `رقم الهاتف المدخل (${phone.length} أرقام) يجب أن يكون 11 رقماً بالضبط! ⚠️`;
      return;
    }

    try {
      saveBtn.disabled = true;
      msg.style.color = "#007BFF";
      msg.innerText = "جاري حفظ الرقم في السحابة... ⏳";

      const querySnapshot = await getDocs(collection(db, "contacts"));
      let exists = false;
      querySnapshot.forEach((doc) => {
        if (doc.data().phone === phone) {
          exists = true;
        }
      });

      if (exists) {
        msg.style.color = "#e74c3c";
        msg.innerText = "هذا الرقم مسجل مسبقاً في الدليل السحابي! ⚠️";
        saveBtn.disabled = false;
        return;
      }

      await addDoc(collection(db, "contacts"), {
        name: name,
        nickname: nickname,
        job: job,
        phone: phone,
        createdAt: new Date()
      });

      msg.style.color = "#28a745";
      msg.innerText = "تم إضافة الرقم إلى السحابة بنجاح! ✅";

      setTimeout(() => {
        document.getElementById("name").value = "";
        document.getElementById("nickname").value = "";
        document.getElementById("job").value = "";
        document.getElementById("phone").value = "";
        msg.innerText = "";
        saveBtn.disabled = false;
      }, 2000);

    } catch (error) {
      console.error("خطأ أثناء الحفظ بالسحابة: ", error);
      msg.style.color = "#e74c3c";
      msg.innerText = "حدث خطأ أثناء الاتصال بالسحابة ❌";
      saveBtn.disabled = false;
    }
  }
</script>

</body>
</html>
